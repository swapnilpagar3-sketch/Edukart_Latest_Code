      <body class="bg-light">

    <div class="container py-5">

        <div [hidden]="!submitted" class="mb-4">

            <div class="alert alert-success text-center shadow-sm rounded-3 fw-semibold mb-0">

                <i class="bi bi-check-circle-fill me-2"></i>

                This Product is already added to Cart

            </div>

        </div>

        <div class="card border-0 shadow-lg rounded-4 overflow-hidden" style="height: 350px;">

            <div class="card-body p-4" style="margin-top: -55px">

                <div class="row align-items-center">

                    <!-- Product Image -->

                    <div class="col-lg-6 text-center mb-4 mb-lg-0">

                        <div class="bg-light rounded-4 p-4 shadow-sm">

                            <img src="{{product.imgaddress}}"
                                 class="img-fluid rounded-3"
                                 alt="Product Image"
                                 style="height: 250px; object-fit:contain;">

                        </div>

                    </div>

                    <!-- Product Details -->

                    <div class="col-lg-6">

                        <span class="badge bg-success rounded-pill px-3 py-2 mb-3">

                            Premium Product

                        </span>

                        <h2 class="fw-bold text-success mb-3">

                            {{product.name}}

                        </h2>

                        <div class="d-flex align-items-center mb-3">

                            <i class="bi bi-star-fill text-warning me-1"></i>
                            <i class="bi bi-star-fill text-warning me-1"></i>
                            <i class="bi bi-star-fill text-warning me-1"></i>
                            <i class="bi bi-star-fill text-warning me-1"></i>
                            <i class="bi bi-star-half text-warning me-3"></i>

                            <span class="text-muted">

                                41 reviews

                            </span>

                        </div>

                        <p class="text-secondary fs-5 lh-lg" style="width:515px; margin-left: -28px">

                            {{product.description}}

                        </p>

                        <h4 class="fw-bold text-dark mb-4">
                            Current Price :

                            <span class="badge bg-warning text-dark fs-5 px-3 py-2 rounded-pill shadow-sm">
                                {{ product.price | currency:'INR':'symbol':'1.2-2' }}
                            </span>
                        </h4>

                        <div class="d-flex flex-wrap gap-3">

                            <button (click)="addToCart()"
                                    [class.disabled]="disabledButton"
                                    class="btn btn-success btn-lg rounded-pill px-4 shadow-sm">

                                <i class="bi bi-cart-plus-fill me-2"></i>

                                {{text}}

                            </button>

                            <button routerLink="/products"
                                    class="btn btn-info btn-lg rounded-pill px-4" 
                                    style="margin-left: 10px;">

                                <i class="bi bi-arrow-left-circle me-2"></i>

                                Continue Shopping

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
