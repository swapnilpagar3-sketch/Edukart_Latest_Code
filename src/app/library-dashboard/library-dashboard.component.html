  <div class="container py-5">

    <!-- Heading -->

    <div class="row justify-content-center mb-5">

        <div class="col-lg-8 text-center" style="margin-top: -35px;">

            <span class="badge bg-primary px-3 py-2 rounded-pill shadow-sm mb-3">
                <i class="bi bi-book-half me-2"></i>
                Library Dashboard
            </span>

            <h2 class="fs-6 fw-bold text-success mb-3">
                <i class="bi bi-journal-richtext me-2"></i>
                Books Availability in EduKart Library
            </h2>

            <p class="text-muted fs-5">
                Browse the available books in our virtual library.
            </p>

        </div>

    </div>

    <!-- Table Card -->

    <div class="card border-0 shadow-lg rounded-4" style="margin-top: -45px;">

        <div class="card-header bg-success text-white py-3 rounded-top-4">

            <h4 class="mb-0 fw-bold">

                <i class="bi bi-bookshelf me-2"></i>

                Available Books

            </h4>

        </div>

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-dark">

                        <tr class="text-center">

                            <th class="py-3">Sr No</th>

                            <th class="py-3">
                                <i class="bi bi-upc-scan me-1"></i>
                                ISBN
                            </th>

                            <th class="py-3">
                                <i class="bi bi-geo-alt-fill me-1"></i>
                                AISLE
                            </th>

                            <th class="py-3">
                                <i class="bi bi-book-fill me-1"></i>
                                Book Name
                            </th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr *ngFor="let book of bookDetails; let ndx = index">

                            <td class="text-center fw-bold">

                                <span class="badge bg-primary rounded-pill">

                                    {{ndx+1}}

                                </span>

                            </td>

                            <td class="fw-semibold text-secondary">

                                {{book.isbn}}

                            </td>

                            <td>

                                <span class="badge bg-info text-dark px-3 py-2 rounded-pill">

                                    {{book.aisle}}

                                </span>

                            </td>

                            <td class="fw-semibold text-dark">

                                <i class="bi bi-book me-2 text-success"></i>

                                {{book.book_name}}

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

        <div class="card-footer bg-light text-end">

            <span class="badge bg-success fs-6 px-3 py-2 rounded-pill">

                Total Books :
                {{bookDetails.length}}

            </span>

        </div>

    </div>

</div>
